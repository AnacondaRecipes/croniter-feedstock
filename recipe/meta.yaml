{% set name = "croniter" %}
{% set version = "6.2.4" %}
{% set ignore_tests = "" %}
{% set ignore_tests = " --ignore=src/croniter/tests/test_croniter_dst_repetition.py" %}  # [win]

#   >       time.tzset()
#   E       AttributeError: module 'time' has no attribute 'tzset'
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fc124f751b1b04805c2a04b061898b436b45ab2320b045e1e052ea895de65189

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - hatchling ==1.30.1
    - packaging ==26.2
    - pathspec ==1.1.1
    # Temporary downstream deviation from upstream build-system pin (pluggy==1.6.0)
    # because pluggy 1.6.0 is not yet available here.
    # TODO: Re-pin exactly when available.
    - pluggy ==1.6.0
    - trove-classifiers ==2026.6.1.19
  run:
    - python
    - python-dateutil

test:
  source_files:
    - src/croniter
  imports:
    - croniter
    - croniter.croniter
  commands:
    - pip check
    # pyargs not work tests folder excluded from the site_pkg dir
    - pytest -v src/croniter {{ ignore_tests }}
  requires:
    - pip
    - pytest >=8.3.3
    - pytz >2021.1

about:
  home: https://github.com/pallets-eco/croniter
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: croniter provides iteration for datetime object with cron like format
  description: croniter provides iteration for the datetime object with a cron like format
  dev_url: https://github.com/pallets-eco/croniter
  doc_url: https://github.com/pallets-eco/croniter#readme

extra:
  recipe-maintainers:
    - pmlandwehr
    - mariusvniekerk
