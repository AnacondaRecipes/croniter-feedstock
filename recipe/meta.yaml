{% set name = "croniter" %}
{% set version = "7.0.0" %}
{% set ignore_tests = "" %}
{% set ignore_tests = " --ignore=src/croniter/tests/test_croniter_dst_repetition.py" %}  # [win]

#   >       time.tzset()
#   E       AttributeError: module 'time' has no attribute 'tzset'
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a0b2568303c774f6a4ea2d4ce2e72b1ee911029c7070d64a1befe05cdb107f5a

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - hatchling ==1.33.0
    - packaging ==26.3
    - pathspec ==1.1.1
    - pluggy ==1.7.0
    - trove-classifiers ==2026.9.21.13
  run:
    - python
    - python-dateutil

test:
  source_files:
    - src/croniter
  imports:
    - croniter
    - croniter.croniter
  commands:
    - pip check
    # pyargs not work tests folder excluded from the site_pkg dir
    - pytest -vv src/croniter {{ ignore_tests }}
  requires:
    - pip
    - pytest >=8.3.3
    - pytz >2021.1

about:
  home: https://github.com/pallets-eco/croniter
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: croniter provides iteration for datetime object with cron like format
  description: croniter provides iteration for the datetime object with a cron like format
  dev_url: https://github.com/pallets-eco/croniter
  doc_url: https://github.com/pallets-eco/croniter#readme

extra:
  recipe-maintainers:
    - pmlandwehr
    - mariusvniekerk
